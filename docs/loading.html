<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trace Resolve | Loading States</title>
<style>
*{box-sizing:border-box}:root{--bg:#f6f2f7;--paper:#fff;--ink:#1c1620;--muted:#796f80;--line:#dfd5e2;--dark:#171219}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 60px}
h1{font-size:clamp(40px,7vw,74px);letter-spacing:-.06em;margin:0 0 8px}
.lead{color:var(--muted);line-height:1.6;max-width:700px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;min-height:235px}
.card h2{font-size:15px;margin:0 0 18px}
.center{height:150px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px}
.center object{display:block;margin:0 auto 12px}
.fake{height:12px;border-radius:999px;background:#eee8f0;margin:10px 0}.fake.short{width:64%}
.button{display:inline-flex;align-items:center;gap:9px;border:0;border-radius:10px;padding:12px 15px;background:#241728;color:white;font-weight:750}
.dark{background:var(--dark);color:white;border-color:#302735}.dark .center{color:#c6b8c9}
.process{display:flex;align-items:center;gap:13px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#fffafd}
.process b{display:block;font-size:13px}.process span{font-size:12px;color:var(--muted)}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style>
</head><body><main class="shell">
<h1>Real loading states.</h1>
<p class="lead">These examples use the exact production SVG, not a separate reconstruction.</p>
<div class="grid">
  <section class="card">
    <h2>Page loading</h2>
    <div class="center">
      <div>
        <object data="trace-resolve.svg" type="image/svg+xml" width="48" height="48"></object>
        Loading Portal…
      </div>
    </div>
  </section>

  <section class="card dark">
    <h2>Consensus processing</h2>
    <div class="center">
      <div>
        <object data="trace-resolve.svg" type="image/svg+xml" width="42" height="42"></object>
        Reaching consensus…
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Card loading</h2>
    <div class="process">
      <object data="trace-resolve.svg" type="image/svg+xml" width="28" height="28"></object>
      <div><b>Loading activity</b><span>Fetching the latest state</span></div>
    </div>
    <div class="fake"></div><div class="fake"></div><div class="fake short"></div>
  </section>

  <section class="card">
    <h2>Button loading</h2>
    <button class="button" type="button">
      <object data="trace-resolve.svg" type="image/svg+xml" width="18" height="18"></object>
      Processing
    </button>
  </section>
</div>
</main></body>
</html>
